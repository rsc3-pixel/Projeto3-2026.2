<div class="rv-app" [attr.data-theme]="theme()" [class.collapsed]="collapsed()">

  <!-- ── Sidebar ──────────────────────────────────────────── -->
  <aside class="rv-side">

    <div class="rv-side-head">
      <div class="rv-brand">
        <span class="rv-brand-badge">RV</span>
        <div class="rv-brand-text">
          <strong>Rota Vital</strong>
          <span>Sistema de Gestão</span>
        </div>
      </div>
      <button class="rv-side-toggle" (click)="toggleCollapse()" [title]="collapsed() ? 'Expandir' : 'Recolher'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="18" rx="3"/>
          <path d="M9.5 3v18"/>
          <path d="M5 8h3M5 12h3"/>
        </svg>
      </button>
    </div>

    <nav class="rv-nav" aria-label="Navegação principal">

      <div class="rv-nav-section">
        <p class="rv-nav-group">Visão Geral</p>
        <a routerLink="/painel" routerLinkActive class="rv-nav-link" #rlPainel="routerLinkActive"
           [attr.data-active]="rlPainel.isActive || null" data-tip="Painel">
          <svg class="rv-nav-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="2" width="6" height="6" rx="1.5"/>
            <rect x="10" y="2" width="6" height="6" rx="1.5"/>
            <rect x="2" y="10" width="6" height="6" rx="1.5"/>
            <rect x="10" y="10" width="6" height="6" rx="1.5"/>
          </svg>
          <span class="rv-side-label">Painel</span>
        </a>
      </div>

      <div class="rv-nav-section">
        <p class="rv-nav-group">Operações</p>
        <a routerLink="/bolsas" routerLinkActive class="rv-nav-link" #rlBolsas="routerLinkActive"
           [attr.data-active]="rlBolsas.isActive || null" data-tip="Estoque">
          <svg class="rv-nav-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <path d="M9 2C7 2 5 4 5 6.5S7 12 9 16c2-4 4-7 4-9.5S11 2 9 2z"/>
          </svg>
          <span class="rv-side-label">Estoque</span>
        </a>
        <a routerLink="/requisicoes" routerLinkActive class="rv-nav-link" #rlReq="routerLinkActive"
           [attr.data-active]="rlReq.isActive || null" data-tip="Requisições">
          <svg class="rv-nav-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <rect x="3" y="2" width="12" height="14" rx="2"/>
            <path d="M6 6h6M6 9h6M6 12h4"/>
          </svg>
          <span class="rv-side-label">Requisições</span>
        </a>
        <a routerLink="/rotas" routerLinkActive class="rv-nav-link" #rlRotas="routerLinkActive"
           [attr.data-active]="rlRotas.isActive || null" data-tip="Rotas">
          <svg class="rv-nav-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <rect x="1" y="6" width="10" height="7" rx="1"/>
            <path d="M11 9l3 1.5v3H11"/>
            <circle cx="4" cy="14" r="1.5"/>
            <circle cx="13" cy="14" r="1.5"/>
          </svg>
          <span class="rv-side-label">Rotas</span>
        </a>
      </div>

      <div class="rv-nav-section">
        <p class="rv-nav-group">Cadastros</p>
        <a routerLink="/hemocentros" routerLinkActive class="rv-nav-link" #rlHemo="routerLinkActive"
           [attr.data-active]="rlHemo.isActive || null" data-tip="Hemocentros">
          <svg class="rv-nav-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <rect x="2" y="5" width="14" height="10" rx="1"/>
            <path d="M5 5V3.5A1.5 1.5 0 0 1 6.5 2h5A1.5 1.5 0 0 1 13 3.5V5"/>
            <path d="M6 10h2m2 0h2"/>
          </svg>
          <span class="rv-side-label">Hemocentros</span>
        </a>
        <a routerLink="/hospitais" routerLinkActive class="rv-nav-link" #rlHosp="routerLinkActive"
           [attr.data-active]="rlHosp.isActive || null" data-tip="Hospitais">
          <svg class="rv-nav-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <rect x="2" y="4" width="14" height="11" rx="1"/>
            <path d="M9 7v4m-2-2h4"/>
            <path d="M6 15v-3h2v3m2 0v-3h2v3"/>
          </svg>
          <span class="rv-side-label">Hospitais</span>
        </a>
      </div>

    </nav>

  </aside>

  <!-- ── Work area ─────────────────────────────────────────── -->
  <div class="rv-work">

    <header class="rv-topbar">
      <nav class="rv-crumbs" aria-label="Localização">
        <span>Rota Vital</span>
        <span aria-hidden="true" style="opacity:.4">›</span>
        <strong>{{ pageTitle() }}</strong>
      </nav>
      <div class="rv-top-actions">
        <button class="rv-top-icon" (click)="toggleTheme()" [title]="theme() === 'dark' ? 'Modo claro' : 'Modo escuro'">
          @if (theme() === 'dark') {
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <circle cx="8" cy="8" r="3"/>
              <line x1="8" y1="1" x2="8" y2="2.5"/>
              <line x1="8" y1="13.5" x2="8" y2="15"/>
              <line x1="1" y1="8" x2="2.5" y2="8"/>
              <line x1="13.5" y1="8" x2="15" y2="8"/>
              <line x1="3.2" y1="3.2" x2="4.2" y2="4.2"/>
              <line x1="11.8" y1="11.8" x2="12.8" y2="12.8"/>
              <line x1="12.8" y1="3.2" x2="11.8" y2="4.2"/>
              <line x1="4.2" y1="11.8" x2="3.2" y2="12.8"/>
            </svg>
          } @else {
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13 10a6 6 0 1 1-7-7 4.5 4.5 0 0 0 7 7z"/>
            </svg>
          }
        </button>
      </div>
    </header>

    <main class="rv-main">
      <router-outlet />
    </main>

  </div>
</div>
