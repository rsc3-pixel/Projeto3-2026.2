# Perfil do ambiente em container (docker compose).
#
# Diferente do perfil padrao, que usa H2 em memoria, aqui a aplicacao fala com
# um PostgreSQL em outro container. Os dados sobrevivem ao desligamento porque
# ficam num volume nomeado, e nao dentro do container.
#
# Nenhum valor sensivel esta escrito aqui: tudo vem de variavel de ambiente,
# definida no .env a partir do .env.example. Assim o mesmo arquivo serve para
# qualquer maquina, e o repositorio nao carrega senha nenhuma.

# --- Banco ---
#
# O host "banco" nao e um endereco: e o nome do servico no compose.yaml. A rede
# que o Compose cria resolve esse nome para o IP do container, entao a
# aplicacao encontra o banco sem ninguem precisar descobrir IP.
spring.datasource.url=jdbc:postgresql://${DB_HOST:banco}:${DB_PORT:5432}/${DB_NAME:rotavital}
spring.datasource.username=${DB_USER:rotavital}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
#
# update, nao create: o banco agora persiste, entao recriar o esquema a cada
# subida apagaria os dados que o volume existe para guardar.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Desligado pelo mesmo motivo do perfil de producao: com a sessao aberta
# durante a renderizacao, uma resposta lenta segura uma conexao do pool.
spring.jpa.open-in-view=false

# --- Seguranca ---
#
# Console de banco acessivel pela rede e acesso direto aos dados.
spring.h2.console.enabled=false

# Stack trace entrega estrutura interna a quem sondar a API.
server.error.include-stacktrace=never

# Apenas health: os demais endpoints do Actuator expoem configuracao e
# variaveis de ambiente, incluindo as credenciais do banco.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# --- Servidor ---
#
# 8080 e nao 127.0.0.1:8081 como no perfil de producao: dentro do container a
# aplicacao precisa aceitar conexao vinda da rede do Compose, senao o
# mapeamento de porta nao alcanca nada.
server.port=8080

# --- Documentacao ---
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false
