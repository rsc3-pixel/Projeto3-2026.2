# Site do Rota Vital no Nginx.
#
# A aplicacao escuta em 127.0.0.1:8081, inalcancavel de fora da maquina. Este
# arquivo e a unica porta de entrada: recebe o trafego da internet e
# encaminha para ela.
#
# Segue o mesmo padrao dos sites que ja rodam nesta VM (flux, boolean-bar).
#
# INSTALACAO
#
#   1. Crie o subdominio rsc3-rotavital em https://www.duckdns.org,
#      apontando para o IP externo desta VM
#
#   2. Instale e habilite o site:
#        sudo cp infra/nginx-rota-vital.conf /etc/nginx/sites-available/rota-vital
#        sudo ln -s /etc/nginx/sites-available/rota-vital /etc/nginx/sites-enabled/
#
#   3. Valide ANTES de aplicar. Este passo nao e opcional numa maquina com
#      outra aplicacao no ar: havendo erro de sintaxe, o nginx -t recusa e o
#      servico atual continua servindo normalmente.
#        sudo nginx -t
#
#   4. Aplique. 'reload' rele a configuracao sem derrubar conexao em
#      andamento, diferente de 'restart'.
#        sudo systemctl reload nginx
#
#   5. Emita o certificado HTTPS:
#        sudo certbot --nginx -d rsc3-rotavital.duckdns.org
#
#      O Certbot EDITA este arquivo sozinho, acrescentando o bloco 'listen
#      443 ssl', as linhas de certificado e um segundo bloco server que
#      redireciona a porta 80 para HTTPS. E por isso que aqui so existe o
#      bloco da porta 80: o resto e gerado.
#
# PARA DESFAZER
#   sudo rm /etc/nginx/sites-enabled/rota-vital
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    server_name rsc3-rotavital.duckdns.org;

    # Tamanho maximo de corpo aceito. A API so recebe JSON pequeno, entao
    # 1 MB e folgado e ainda limita abuso.
    client_max_body_size 1M;

    # --- Bloqueio do console do H2 ---
    #
    # O perfil de producao ja desliga o console
    # (spring.h2.console.enabled=false), entao a aplicacao responderia 404 de
    # qualquer forma. Este bloco e uma segunda barreira: se alguem religar o
    # console numa depuracao e esquecer, o Nginx recusa antes de a requisicao
    # chegar la.
    location /h2-console {
        return 404;
    }

    # --- A aplicacao ---
    location / {
        proxy_pass http://127.0.0.1:8081;

        # 127.0.0.1 e nao o IP externo: o trafego nao sai da maquina.

        proxy_http_version 1.1;

        # Cabecalhos que preservam a identidade do cliente original. Sem eles
        # a aplicacao veria toda requisicao vindo do proprio servidor, e o log
        # registraria sempre 127.0.0.1.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Medido na VM: a JVM leva de 21 a 23 segundos para subir, e o
        # timeout anterior era de 30s. A margem de sete segundos sumia quando
        # a maquina estava sob carga, e o Nginx desistia antes de a aplicacao
        # responder, devolvendo 504 (issue #58). Nao era a aplicacao falhando,
        # era o proxy cortando.
        #
        # 90s da folga de quatro vezes o tempo medido, e continua curto o
        # bastante para nao deixar uma requisicao de verdade pendurada: uma
        # consulta normal responde em menos de 100ms.
        proxy_connect_timeout 10s;
        proxy_read_timeout    90s;
        proxy_send_timeout    90s;
    }

    # --- Log proprio ---
    #
    # Separado do log geral para nao misturar com o trafego das outras
    # aplicacoes desta VM. Facilita diagnosticar so o Rota Vital:
    #   sudo tail -f /var/log/nginx/rota-vital-access.log
    access_log /var/log/nginx/rota-vital-access.log;
    error_log  /var/log/nginx/rota-vital-error.log;
}
