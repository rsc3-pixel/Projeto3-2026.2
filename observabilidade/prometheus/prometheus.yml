# Prometheus do ambiente em container (compose.yaml).
#
# Um job por aplicacao e por exporter. Todos os alvos estao na rede interna
# do compose: o nome e o do servico no compose.yaml e a porta e a de DENTRO
# do container, nenhuma delas publicada na internet.
#
# Para coletar outra aplicacao Java do Projeto Integrador, copie o job
# rota-vital trocando o nome e o alvo (servico:porta de gestao).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  # Aplicacao: /actuator/prometheus na porta de gestao 8081 (perfil docker).
  # A tag application=rota-vital vem da propria aplicacao (ConfiguracaoMetricas).
  - job_name: rota-vital
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8081"]
        labels:
          ambiente: docker

  # Infraestrutura: host e conteineres.
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # A propria pilha de observabilidade, para saber se ela esta saudavel.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
